name: Check Go project

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - name: Check the code
        run: make check
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check SDK package boundaries
        run: |
          go list -f '{{join .Deps "\n"}}' . > /tmp/pumpfun-imports.txt
          python3 - <<'PY'
          import pathlib
          imports = pathlib.Path('/tmp/pumpfun-imports.txt').read_text().splitlines()
          module = pathlib.Path('go.mod').read_text()
          base = 'github.com/vasyza/pumpfun-sdk/internal/'
          blocked = tuple(base + name for name in ('cli', 'mcp', 'config', 'logging'))
          blocked += ('github.com/spf13/cobra', 'github.com/modelcontextprotocol/go-sdk')
          browsers = ('chromedp', 'playwright', 'go-rod')
          assert not any(path == name or path.startswith(name + '/')
                         for path in imports for name in blocked)
          assert not any(name in path for path in imports for name in browsers)
          assert not any(name in module for name in browsers)
          PY
